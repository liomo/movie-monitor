name: IMAX screening monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a test notification (no cinema data required)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: imax-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test notification
        if: github.event_name == 'workflow_dispatch' && inputs.test_notification == true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python -c 'from monitor import send_wechat; assert send_wechat([("通知通道测试", "https://github.com/liomo/movie-monitor")])'
      - name: Monitor
        if: github.event_name != 'workflow_dispatch' || inputs.test_notification != true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python monitor.py
      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: save monitor state"
            git push
          fi
