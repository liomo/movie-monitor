name: IMAX screening monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a test notification (no cinema data required)'
        type: boolean
        required: false
        default: false
      probe_source:
        description: 'Test Jisu coverage without notifications (uses trial quota)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: imax-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test showtime matching and notification state
        run: python -m unittest discover -s tests -v
      - name: Test notification
        if: github.event_name == 'workflow_dispatch' && inputs.test_notification == true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python -c 'from monitor import send_wechat; assert send_wechat([("通知通道测试", "https://github.com/liomo/movie-monitor")])'
      - name: Monitor
        if: github.event_name != 'workflow_dispatch' || inputs.test_notification != true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          JISU_API_KEY: ${{ secrets.JISU_API_KEY }}
          LIVE_MONITOR_ENABLED: ${{ vars.LIVE_MONITOR_ENABLED }}
          PROBE_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_source == true }}
        run: |
          if [ "$PROBE_SOURCE" = "true" ]; then
            python monitor.py --probe
          else
            python monitor.py
          fi
      - name: Save source diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-diagnostic
          path: source_report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: save monitor state"
            git push
          fi

